name: Android Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Build debug and release APKs
        run: ./gradlew clean :localizationTest assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: InstallProtection_RU-debug
          path: APP/installCheck/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: InstallProtection_RU-release
          path: APP/installCheck/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      contents: write

    steps:
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Download unsigned release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: InstallProtection_RU-release
          path: release-input

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk="$(find release-input -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          package_line="$("$ANDROID_HOME/build-tools/33.0.0/aapt" dump badging "$unsigned_apk" | head -n 1)"
          version_code="$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" <<< "$package_line")"
          if [[ -z "$version_code" || "$GITHUB_REF_NAME" != "v${version_code}-"* ]]; then
            echo "Tag must start with v<versionCode>- (expected v${version_code}-...)" >&2
            exit 1
          fi

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/install-protection-ru.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"

      - name: Sign and verify release APK
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEY_ALIAS" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "Release signing secrets are incomplete" >&2
            exit 1
          fi
          unsigned_apk="$(find release-input -maxdepth 1 -type f -name '*-unsigned.apk' -print -quit)"
          if [[ -z "$unsigned_apk" ]]; then
            echo "Unsigned release APK was not downloaded" >&2
            exit 1
          fi
          release_apk="${unsigned_apk%-unsigned.apk}.apk"
          "$ANDROID_HOME/build-tools/33.0.0/zipalign" -f -p 4 "$unsigned_apk" "$release_apk"
          "$ANDROID_HOME/build-tools/33.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/install-protection-ru.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$release_apk.signed" \
            "$release_apk"
          mv "$release_apk.signed" "$release_apk"
          "$ANDROID_HOME/build-tools/33.0.0/apksigner" verify --verbose --print-certs "$release_apk"
          release_dir="$(dirname "$release_apk")"
          release_name="$(basename "$release_apk")"
          (cd "$release_dir" && sha256sum "$release_name" > "$release_name.sha256")

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_apk="$(find release-input -maxdepth 1 -type f -name '*.apk' ! -name '*-unsigned.apk' -print -quit)"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "$release_apk" \
            "$release_apk.sha256" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/install-protection-ru.jks"
