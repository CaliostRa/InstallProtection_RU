apply plugin: 'com.android.application'

def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def releaseSigningValues = [
        releaseStoreFile,
        releaseKeyAlias,
        releaseStorePassword,
        releaseKeyPassword
]
def hasAnyReleaseSigning = releaseSigningValues.any { it != null && !it.isEmpty() }
def hasReleaseSigning = releaseSigningValues.every { it != null && !it.isEmpty() }
if (hasAnyReleaseSigning && !hasReleaseSigning) {
    throw new GradleException('Release signing is only partially configured. Set all ANDROID_KEY* variables.')
}

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.0"
    
    defaultConfig {
        applicationId "com.install.appinstall.xl"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 24103
        versionName "2.1.68-ru3"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def signingSuffix = variant.buildType.name == 'release' && !hasReleaseSigning
                    ? '-unsigned'
                    : ''
            outputFileName = "InstallProtection_RU-${defaultConfig.versionName}-${variant.name}${signingSuffix}.apk"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly fileTree(dir: 'libs/compile_only', include: ['*.jar'])
}
