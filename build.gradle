buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

tasks.register('localizationTest', Exec) {
    group = 'verification'
    description = 'Runs localization and Xposed/LSPatch compatibility invariants.'
    commandLine 'python3', '-m', 'unittest', 'tools.tests.test_source_localization', '-v'
}
